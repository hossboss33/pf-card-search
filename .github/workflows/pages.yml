# Deploys the static card-search site (site/) to GitHub Pages.
# Actions-based deploy: the legacy Pages builder queues unpredictably.
name: Deploy site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Package site
        run: |
          # .nojekyll keeps Pages from mangling underscore paths and lets
          # every asset (wasm, sqlite) through untouched.
          touch site/.nojekyll
          # Version-stamp asset URLs with the commit SHA so a cached HTML page
          # can only ever load the assets it was built with. Without this, a
          # 10-minute-stale app.js paired with a fresh db/config.json requests
          # chunk names that no longer exist and the site hard-fails during
          # every rollout.
          V="${GITHUB_SHA::10}"
          sed -i "s|src=\"\([^\"]*\.js\)\"|src=\"\1?v=$V\"|g; s|href=\"style.css\"|href=\"style.css?v=$V\"|g" site/index.html
          grep -n "?v=$V" site/index.html | head -12
          ls -la site/
          du -sh site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
