# Deploys the static card-search site (site/) to GitHub Pages.
# Actions-based deploy: the legacy Pages builder queues unpredictably.
name: Deploy site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Package site
        run: |
          # .nojekyll keeps Pages from mangling underscore paths and lets
          # every asset (wasm, sqlite) through untouched.
          touch site/.nojekyll
          ls -la site/
          du -sh site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
